name: Build & Release TaiChi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Application & DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Build Environment
        run: |
          echo "Xcode Version:"
          xcodebuild -version || true
          echo "Swift Version:"
          swift --version

      - name: Build Application and Packaging
        run: |
          bash build_app.sh --dmg

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="nightly"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaiChi-macOS-Build
          path: |
            releases/TaiChi.dmg
            releases/TaiChi.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: TaiChi ${{ steps.vars.outputs.tag }}
          files: |
            releases/TaiChi.dmg
            releases/TaiChi.zip
          generate_release_notes: true
          draft: false
          prerelease: false
